<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Gyrus Neuro Workstation</title>
<meta name="description" content="Real pre-operative MRI with DTI tractography, 3D rendering, quantitative analysis and trajectory planning in the browser.">
<meta property="og:type" content="website">
<meta property="og:title" content="Gyrus Neuro Workstation">
<meta property="og:description" content="Real pre-operative MRI with DTI tractography, 3D rendering, quantitative analysis and trajectory planning in the browser.">
<meta property="og:url" content="https://nathan1658.github.io/gyrus/">
<meta property="og:image" content="https://nathan1658.github.io/gyrus/docs/social.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><b>Gyrus</b><span>Neuro Workstation</span></div>
    <div class="seg" id="caseSeg" role="group" aria-label="Case"></div>
    <div class="chips" id="seqChips" role="group" aria-label="Sequence"></div>
    <div class="spacer"></div>
    <span class="realbadge" title="Every image voxel is real patient MRI">REAL PATIENT MRI</span>
    <div class="seg" id="layoutSeg" role="group" aria-label="Layout">
      <button id="lay-quad" aria-pressed="true" title="Four views">2×2</button>
      <button id="lay-focus" aria-pressed="false" title="One large view">1+3</button>
    </div>
    <button class="ghost" id="aboutBtn">About the data</button>
  </header>
  <main class="work">
    <section class="viewer" id="viewer">
      <canvas id="gl"></canvas>
      <canvas id="ov"></canvas>
      <div class="grid" id="grid"></div>
      <div class="loading" id="loading"><div class="box"><div class="t"><span id="loadMsg">Loading</span><span id="loadPct">0%</span></div><div class="bar"><i id="loadBar"></i></div><div class="log" id="loadLog"></div></div></div>
      <div class="acq" id="acq" hidden>
        <div class="acq-top"><h3 id="acqTitle">k-space acquisition</h3><span class="meta-line" id="acqInfo"></span><span class="spacer" style="flex:1"></span><button class="ghost" id="acqReplay">Replay</button><button class="ghost" id="acqClose">Close</button></div>
        <div class="acq-main">
          <div class="acq-cell"><div class="cap"><span>k-space (log magnitude)</span><span id="acqLine"></span></div><canvas id="kcan" width="256" height="256"></canvas></div>
          <div class="acq-cell"><div class="cap"><span>Reconstruction (inverse 2D FFT)</span><span id="acqTime"></span></div><canvas id="rcan" width="256" height="256"></canvas></div>
        </div>
        <canvas id="psd" width="900" height="96"></canvas>
      </div>
    </section>
    <aside class="side">
      <nav class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="findings">Findings</button>
        <button role="tab" aria-selected="false" data-tab="plan">Plan</button>
        <button role="tab" aria-selected="false" data-tab="scan">Scan</button>
        <button role="tab" aria-selected="false" data-tab="ask" id="askTab" hidden>Ask</button>
      </nav>
      <div class="panel" id="tab-findings"></div>
      <div class="panel" id="tab-plan" hidden></div>
      <div class="panel" id="tab-scan" hidden></div>
      <div class="panel" id="tab-ask" hidden></div>
    </aside>
  </main>
  <footer class="statusbar"><div class="status" id="status"><span class="dim">Move over an image to read position, signal and anatomy</span></div><div class="chips" id="ovChips" role="group" aria-label="Overlays"></div></footer>
</div>
<div class="about" id="about" hidden><div class="card" id="aboutCard"></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
